# /etc/nginx/sites-available/shortstick.conf
# Basit HTTP (SSL yok) reverse proxy
# Backend Kestrel: http://127.0.0.1:5000 (Program.cs sonunda 0.0.0.0:5000 ekliyor)
# İsteğe bağlı WebSocket endpoint: /ws

server {
    listen 80;
    server_name YOUR_SERVER_IP; # Eğer domain eklenirse buraya domain yazın (örn. api.shortstickgame.com)

    # API ve WebSocket
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (oyun güncellemeleri)
    location /ws {
        proxy_pass         http://127.0.0.1:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # İsteğe bağlı: health check veya root
    location = / {
        proxy_pass http://127.0.0.1:5000/;
    }

    # Statik dosya serve etmiyorsanız fazlasına gerek yok
    # Hata sayfaları
    error_page 502 503 504 /50x.html;
    location = /50x.html { return 500 'Upstream error'; }
}

